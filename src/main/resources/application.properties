spring.application.name=gym-management-service
server.port=8082

# Aiven MySQL. SSL is required; the connection is never downgraded to plaintext.
spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?sslMode=REQUIRED
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# The gym_db schema is owned by the database. Hibernate only validates mappings; it never creates or alters tables.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Must match gym-auth-service exactly. Tokens are validated locally; this service never calls the Auth Service.
app.jwt.issuer=gym-auth-service
app.jwt.secret=${JWT_SECRET}
